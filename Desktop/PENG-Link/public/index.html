<!DOCTYPE html>
<html>
<head>
    <title>PENG-Link 🐧</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>🐧 PENG-Link CORE</h1>
    <div id="status-text" style="color: #8b4513; font-weight: bold; margin-bottom: 10px;">🐧 펭링크 대기 중</div>
    <button id="start">🎤 무전 시작</button>
    <button id="stop">🛑 중단</button>

    <hr>
    <div id="chat-box" style="height: 150px; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
        <div style="font-size: 0.8em; color: gray;">채팅창에 오신 걸 환영합니다!</div>
    </div>
    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." style="width: 70%; padding: 5px;">
    <button id="send-btn" style="padding: 5px 10px;">전송</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mediaRecorder;
        let audioCtx = null;
        let nextStartTime = 0;

        /***********************************************************
         * [CORE] 음성 스트리밍 데이터 관리부
         * 설명: 조각난 WebM 데이터를 합쳐서 재생 가능한 형태로 변환합니다.
         ***********************************************************/
        let audioChunks = []; // 수신된 데이터 조각 저장소

        const statusText = document.getElementById('status-text');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // --- 텍스트 채팅 로직 ---
        sendBtn.onclick = () => {
            const msg = chatInput.value;
            if (msg.trim()) {
                socket.emit('send-text', msg);
                chatInput.value = '';
            }
        };

        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

        socket.on('receive-text', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<b style="color:#007bff;">[${data.id}]</b>: ${data.text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // --- 음성 무전 로직 ---
        document.getElementById('start').onclick = async () => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = MediaRecorder.isTypeSupported('audio/webm; codecs=opus') 
                                 ? 'audio/webm; codecs=opus' : 'audio/ogg; codecs=opus';
                                 
                mediaRecorder = new MediaRecorder(stream, { mimeType });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        socket.emit('audio-chunk', event.data);
                    }
                };

                // 200ms 정도로 조각 크기를 살짝 키워 안정성을 확보합니다.
                mediaRecorder.start(200); 
                if(statusText) statusText.innerText = "📡 내 목소리 송출 중...";
            } catch (err) { alert("마이크 권한을 허용해주세요!"); }
        };

        document.getElementById('stop').onclick = () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                if(statusText) statusText.innerText = "🐧 펭링크 대기 중";
            }
        };

        /***********************************************************
         * [CORE] 음성 수신 및 디코딩 최적화 파트
         * 특징: 조각난 데이터를 Blob으로 합쳐 전체 맥락을 유지하며 재생합니다.
         ***********************************************************/
        socket.on('audio-stream', async (data) => {
            if (!audioCtx) return;

            // 새로운 조각을 큐에 추가
            audioChunks.push(data);

            // 너무 잦은 디코딩을 방지하기 위해 2개 이상의 조각이 모였을 때 처리
            if (audioChunks.length >= 2) {
                try {
                    const blob = new Blob(audioChunks, { type: 'audio/webm; codecs=opus' });
                    const arrayBuffer = await blob.arrayBuffer();
                    
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioCtx.destination);

                    const currentTime = audioCtx.currentTime;
                    if (nextStartTime < currentTime) nextStartTime = currentTime + 0.1;
                    
                    source.start(nextStartTime);
                    
                    // 재생 예약 후 오래된 조각은 비워줌 (메모리 관리)
                    if (audioChunks.length > 10) audioChunks.shift(); 

                } catch (e) {
                    // 데이터가 아직 불충분할 때 발생하는 에러는 무시하고 다음 조각을 기다림
                }
            }
        });
    </script>
</body>
</html>
