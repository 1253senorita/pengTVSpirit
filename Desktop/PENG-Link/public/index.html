<!DOCTYPE html>
<html>
<head>
    <title>PENG-Link 🐧</title>
    <meta charset="UTF-8">
    <style>
        /* [KEEP] UI/UX 레이아웃 스타일 */
        #entry-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #connect-btn {
            padding: 20px 40px; font-size: 1.5rem; cursor: pointer;
            border-radius: 50px; border: none; background: #3498db; color: white;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #main-app { filter: blur(5px); pointer-events: none; transition: filter 0.5s ease; padding: 20px; }
        
        /* PTT 버튼 스타일 강화 */
        #start { 
            padding: 25px; font-size: 1.2rem; width: 100%; 
            background: #2ecc71; color: white; border: none; border-radius: 10px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        #start:active { background: #e74c3c; transform: scale(0.98); }
        .audio-msg { margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div id="entry-layer">
        <h1 style="color: white; font-size: 3rem; margin-bottom: 10px;">🐧 PENG-Link</h1>
        <button id="connect-btn">펭링크 접속하기</button>
    </div>

    <div id="main-app">
        <h1>🐧 PENG-Link CORE</h1>
        <div id="status-text" style="color: #8b4513; font-weight: bold; margin-bottom: 10px;">🐧 펭링크 대기 중</div>
        
        <button id="start">🎤 누르고 말하기 (PTT)</button>
        
        <hr>
        <div id="chat-box" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;"></div>
        <input type="text" id="chat-input" placeholder="메시지 입력..." style="width: 70%; padding: 10px;">
        <button id="send-btn" style="padding: 10px;">전송</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mediaRecorder;
        let audioCtx = null;
        let nextStartTime = 0;
        let audioChunks = []; // 수신용 버퍼
        let fullAudioChunks = []; // 서버 저장용(Archive) 버퍼

        /* [CORE] 초기 활성화 */
        document.getElementById('connect-btn').onclick = async () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            document.getElementById('entry-layer').style.display = 'none';
            document.getElementById('main-app').style.filter = 'none';
            document.getElementById('main-app').style.pointerEvents = 'auto';
        };

        /* [SYNC] 무전 시작 (PTT On) */
        const startPTT = async () => {
            fullAudioChunks = []; // 초기화
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });

                mediaRecorder = new MediaRecorder(stream, { 
                    mimeType: 'audio/webm; codecs=opus',
                    audioBitsPerSecond: 128000 
                });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        socket.emit('audio-chunk', e.data); // 실시간 중계
                        fullAudioChunks.push(e.data); // 아카이브 저장
                    }
                };

                mediaRecorder.start(100);
                updateStatus("📡 무전 중...", "#e74c3c");
            } catch (err) { console.error("마이크 권한 오류:", err); }
        };

        /* [ASYNC] 무전 종료 (PTT Off) */
        const stopPTT = () => {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());

                // 서버에 전체 파일 저장 요청
                const finalBlob = new Blob(fullAudioChunks, { type: 'audio/webm' });
                socket.emit('save-audio', finalBlob); 
                
                // UI에 녹음본 표시
                const url = URL.createObjectURL(finalBlob);
                addAudioToChat('나', url);

                updateStatus("🐧 펭링크 대기 중", "#8b4513");
            }
        };

        // PTT 이벤트 바인딩 (PC & 모바일 대응)
        const btn = document.getElementById('start');
        btn.addEventListener('mousedown', startPTT);
        btn.addEventListener('mouseup', stopPTT);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startPTT(); });
        btn.addEventListener('touchend', stopPTT);

        function updateStatus(txt, color) {
            const s = document.getElementById('status-text');
            s.innerText = txt; s.style.color = color;
        }

        /* [CORE] 실시간 음성 수신 및 재생 */
        socket.on('audio-stream', async (data) => {
            if (!audioCtx) return;
            audioChunks.push(data);
            if (audioChunks.length >= 2) {
                const blob = new Blob(audioChunks.splice(0, audioChunks.length), { type: 'audio/webm; codecs=opus' });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if (nextStartTime < now) nextStartTime = now + 0.05;
                source.start(nextStartTime);
                nextStartTime += audioBuffer.duration;
            }
        });

        /* [CHAT] 텍스트 및 오디오 UI 처리 */
        function addAudioToChat(id, url) {
            const div = document.createElement('div');
            div.innerHTML = `<b>[${id}]</b> 무전 기록: <audio controls src="${url}" class="audio-msg"></audio>`;
            document.getElementById('chat-box').appendChild(div);
            document.getElementById('chat-box').scrollTop = chatBox.scrollHeight;
        }

        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        sendBtn.onclick = () => {
            if (chatInput.value.trim()) {
                socket.emit('send-text', chatInput.value);
                chatInput.value = '';
            }
        };
        socket.on('receive-text', (data) => {
            const div = document.createElement('div');
            div.innerHTML = `<b style="color:#007bff;">[${data.id}]</b>: ${data.text}`;
            document.getElementById('chat-box').appendChild(div);
            document.getElementById('chat-box').scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
