<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIKI-ROUTER v5.2</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/modules.css?v=1.0.1"> 
</head>
<body class="neumorphism-layer">

    <header>
        <h1>WIKI-ROUTER v5.2</h1>
        <div id="status-display">
            System Status: <span id="status">Locked</span>
        </div>
    </header>

    <main id="app-viewport">
        <section id="initial-view" class="view-fade">
            <div class="auth-box">
                 <button id="activate-btn" class="neo-btn" onclick="App.activate()">Activate Engine</button>
            </div>
        </section>
    </main>

    <nav id="bottom-nav">
        <button class="nav-btn" onclick="App.switchView('phone')">📞 전화</button>
        <button class="nav-btn" onclick="App.switchView('ptt')">📻 무전</button>
        <button class="nav-btn" onclick="App.switchView('chat')">💬 문자</button>
    </nav>

    <footer>
        <p>© 2026 Spirit System</p>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script src="/js/app-core.js"></script>
</body>
</html>
