timber = "5.0.1"
# Room
room = "2.6.1"
ksp = "2.0.21-1.0.27"
firebaseStorage = "21.0.1" # 추가된 Firebase Storage
firebaseMessaging = "24.1.1" # 추가된 Firebase Messagin



[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
